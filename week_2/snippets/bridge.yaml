# ros_gz_bridge configuration
# Each entry bridges one topic between Gazebo and ROS 2.
# Required fields: ros_topic_name, gz_topic_name, ros_type_name, gz_type_name, direction
# direction: ROS_TO_GZ  (ROS publishes, Gazebo receives)
#            GZ_TO_ROS  (Gazebo publishes, ROS receives)

- ros_topic_name: /cmd_vel
  gz_topic_name: /cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ

