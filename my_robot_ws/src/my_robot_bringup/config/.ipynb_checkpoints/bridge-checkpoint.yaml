# ros_gz_bridge configuration
# Each entry bridges one topic between Gazebo and ROS 2.
# Required fields: ros_topic_name, gz_topic_name, ros_type_name, gz_type_name, direction
# direction: ROS_TO_GZ  (ROS publishes, Gazebo receives)
#            GZ_TO_ROS  (Gazebo publishes, ROS receives)

- ros_topic_name: /cmd_vel
  gz_topic_name: /cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ

# TODO: Add /odom -- carries odometry from the diff-drive plugin into ROS 2.

- ros_topic_name: /odom
  gz_topic_name: /odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS

# TODO: Add /clock -- keeps ROS 2 time in sync with the Gazebo simulation clock.

- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
  
# TODO: Add /joint_states -- publishes actual joint angles from Gazebo to ROS 2.

- ros_topic_name: /joint_states
  gz_topic_name: /joint_states
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

# TODO: Add /tf -- carries the odom->base_link transform published by the

- ros_topic_name: /tf
  gz_topic_name: /tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS


- ros_topic_name: /scan
  gz_topic_name: /lidar
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS