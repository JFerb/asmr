[develop]
script_dir=$base/lib/my_robot_control
[install]
install_scripts=$base/lib/my_robot_control

[flake8]
import-order-style = google
application-import-names = my_robot_bringup,my_robot_control,my_robot_description,my_robot_interfaces,my_robot_nav,my_robot_perception
max-line-length = 160
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202,E201,E131,E221,E222,E226,E241,W503,W504
show-source = true
statistics = true
exclude = .git,__pycache__,build,install,log
